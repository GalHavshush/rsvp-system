services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rsvp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: rsvp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsvp"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports: ["${HTTP_PORT:-8080}:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://rsvp:${POSTGRES_PASSWORD}@db/rsvp
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEFAULT_REGION: ${DEFAULT_REGION:-IL}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-test_csv}
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
